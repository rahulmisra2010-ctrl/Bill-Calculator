<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { margin: 10px 0; padding: 10px; width: 200px; }
        button { padding: 10px 20px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Tip Calculator</h1>
    <label for="amount">Enter Amount:</label>
    <input type="number" id="amount" placeholder="Amount" />
    <br/>
    <label for="tip">Select Tip Percentage:</label>
    <select id="tip">
        <option value="15">15%</option>
        <option value="20">20%</option>
        <option value="25">25%</option>
    </select>
    <br/>
    <button onclick="calculateTip()">Calculate Tip</button>
    <div id="result"></div>

    <script>
        function calculateTip() {
            var amount = document.getElementById('amount').value;
            var tipPercentage = document.getElementById('tip').value;
            var tip = (tipPercentage / 100) * amount;
            var total = parseFloat(amount) + tip;
            document.getElementById('result').innerHTML = `Tip: $${tip.toFixed(2)}<br/>Total: $${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
